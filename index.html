<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi's Projects Hub</title>
    <!-- Yeh line 1 second ke andar aapko aapke fortune card par bhej degi -->
    <meta http-equiv="refresh" content="1; url=./gamified-fortune/">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c20, #15102a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #9d4edd;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        h2 {
            font-weight: 400;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Loading Fortune Prediction Card...</h2>
</body>
</html>
